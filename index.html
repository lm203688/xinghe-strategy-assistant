<style>
/* ============================================================
   兴合战略部智慧助手 — 联合国网站设计语言（United Nations style）
   布局：顶部深蓝工具条 + 白色主标头（徽章/标题）+ 联合国蓝水平主导航
        + 内容区 + 深蓝页脚（区别于原左侧栏，改为联合国官网式顶导航）
   色板：联合国蓝 #009edb 主色 / 深蓝 #004b87 / 藏青 #0b2a4a
        / 背景浅灰 #f4f6f8 / 联合国红 #c20000（仅告警）
   DOM 选择器（#nav/#btn-send/.msg/.act-card/…）与 app.js 完全一致，
   仅重构外观层，不改动任何前端逻辑。
   ============================================================ */
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --sep: #dfe6ec;
  --text: #16283a;
  --secondary: #3f5163;
  --muted: #7d8ea0;
  --accent: #009edb;
  --accent-deep: #004b87;
  --accent-hover: #0087bd;
  --accent-soft: #e5f4fc;
  --navy: #0b2a4a;
  --navy-deep: #071f38;
  --green: #2e8540;
  --green-soft: #e7f3ea;
  --red: #c20000;
  --red-soft: #fbeaea;
  --amber: #b26b00;
  --amber-soft: #fdf3e2;
  --teal: #0e7c8c;
  --teal-soft: #e3f1f4;
  --running: #6f42c1;
  --running-soft: #f0e9fa;
  --slate-soft: #eef2f6;
  --radius: 10px;
  --radius-lg: 14px;
  --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
    Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
  --shadow: 0 1px 3px rgba(11, 42, 74, .07);
  --shadow-lg: 0 18px 52px rgba(11, 42, 74, .22);
  --glass: rgba(255, 255, 255, .92);
  --mono: ui-monospace, "SF Mono", Consolas, "SFMono-Regular", Menlo, monospace;
}
/* 深色：藏青夜色调（联合国蓝暗态） */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #0b1219;
    --panel: #111c27;
    --sep: rgba(0, 158, 219, .2);
    --text: #e8eef4;
    --secondary: #c4d1de;
    --muted: #8296a8;
    --accent: #33b3e6;
    --accent-deep: #7ecbee;
    --accent-hover: #66c1e8;
    --accent-soft: #0d2a3d;
    --navy: #0d2438;
    --navy-deep: #081a29;
    --green: #4caf62;
    --green-soft: #0f2a16;
    --red: #e05555;
    --red-soft: #351313;
    --amber: #e8a33d;
    --amber-soft: #332408;
    --teal: #3fb5c6;
    --teal-soft: #0b2a30;
    --running: #a78bfa;
    --running-soft: #231a3a;
    --slate-soft: #1a2a3a;
    --glass: rgba(17, 28, 39, .85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1219;
  --panel: #111c27;
  --sep: rgba(0, 158, 219, .2);
  --text: #e8eef4;
  --secondary: #c4d1de;
  --muted: #8296a8;
  --accent: #33b3e6;
  --accent-deep: #7ecbee;
  --accent-hover: #66c1e8;
  --accent-soft: #0d2a3d;
  --navy: #0d2438;
  --navy-deep: #081a29;
  --green: #4caf62;
  --green-soft: #0f2a16;
  --red: #e05555;
  --red-soft: #351313;
  --amber: #e8a33d;
  --amber-soft: #332408;
  --teal: #3fb5c6;
  --teal-soft: #0b2a30;
  --running: #a78bfa;
  --running-soft: #231a3a;
  --slate-soft: #1a2a3a;
  --glass: rgba(17, 28, 39, .85);
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
    Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
code, pre, .mono { font-family: var(--mono); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: none; }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* ═══════════════ 联合国式顶部工具条 ═══════════════ */
.un-utility {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; min-height: 34px; padding: 5px 22px;
  background: var(--navy-deep); color: #cfdde9; font-size: 12px;
  letter-spacing: .2px; z-index: 12;
}
.un-utility-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
.un-utility-emblem { color: #7cc7e6; flex: none; }
.un-org { font-weight: 700; color: #eef5fa; letter-spacing: .4px; white-space: nowrap; }
.un-utility-text { color: #8fb0c7; font-size: 11.5px; white-space: nowrap; }
.un-utility-sep { width: 1px; height: 12px; background: rgba(255, 255, 255, .18); }
.un-utility-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.un-health { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.un-health::-webkit-scrollbar { display: none; }
.un-health .chip {
  font-size: 10.5px; padding: 2px 9px; background: rgba(255, 255, 255, .09);
  color: #d4e4ef; border: none;
}
.un-health .chip.ok { background: rgba(60, 190, 100, .22); color: #8fe0aa; }
.un-health .chip.warn { background: rgba(232, 163, 61, .22); color: #ffcf7d; }
.un-health .chip.bad { background: rgba(224, 85, 85, .26); color: #ff9d9d; }
.un-refresh { color: #7f9cb2; font-size: 10.5px; white-space: nowrap; }

/* ═══════════════ 主标头（徽章 + 标题 + 动作） ═══════════════ */
.un-header {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 20px; padding: 14px 26px;
  background: var(--panel); border-bottom: 1px solid var(--sep); z-index: 11;
}
.un-brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.un-emblem { flex: none; display: grid; place-items: center; width: 62px; height: 62px; }
.un-emblem svg { display: block; filter: drop-shadow(0 2px 6px rgba(0, 75, 135, .18)); }
.un-brand-text { min-width: 0; }
.un-title {
  font-size: 22px; font-weight: 800; letter-spacing: -.3px; color: var(--text);
  line-height: 1.18;
}
.un-subtitle {
  font-size: 11.5px; color: var(--muted); letter-spacing: .5px; margin-top: 3px;
  text-transform: uppercase; font-weight: 500;
}
.un-header-actions { display: flex; gap: 9px; align-items: center; flex: none; }

/* ═══════════════ 联合国蓝主导航 ═══════════════ */
.un-nav {
  flex: none; background: var(--accent); z-index: 10;
  box-shadow: 0 2px 0 rgba(0, 75, 135, .12);
}
.un-nav-inner {
  display: flex; align-items: stretch; gap: 0; padding: 0 8px;
  overflow-x: auto; scrollbar-width: none; max-width: 100%;
}
.un-nav-inner::-webkit-scrollbar { display: none; }
#nav a {
  flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  color: rgba(255, 255, 255, .85);
  font-size: 13.5px; font-weight: 600; padding: 13px 12px; position: relative;
  white-space: nowrap; transition: background .15s, color .15s;
  border-bottom: 3px solid transparent;
}
#nav a:hover { background: rgba(255, 255, 255, .14); color: #fff; text-decoration: none; }
#nav a.active {
  background: rgba(255, 255, 255, .2); color: #fff;
  border-bottom-color: #fff;
}
#nav a.active .tab-ico { filter: none; }
.tab-ico { display: inline-flex; align-items: center; justify-content: center; line-height: 1.1; filter: none; opacity: .9; }
.tab-ico svg { display: block; }
.tab-name { letter-spacing: -.1px; }
.tab-badge {
  position: absolute; top: 5px; right: 7px; min-width: 16px; height: 16px;
  padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff;
  font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
}
.tab-badge[hidden] { display: none; }

/* ═══════════════ 内容区 ═══════════════ */
.un-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view { flex: 1; overflow: auto; padding: 28px 40px 48px; }
/* 超宽屏：内容居中限宽，保持大方透气（对话页保留自身限宽） */
.view > *:not(.chat-page) { max-width: 1560px; margin-left: auto; margin-right: auto; }

/* ═══════════════ 深蓝页脚 ═══════════════ */
.un-footer {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; min-height: 38px; padding: 7px 22px;
  background: var(--navy-deep); color: #93adc2; font-size: 11.5px; z-index: 8;
}
.un-footer-left, .un-footer-right { display: flex; align-items: center; gap: 9px; min-width: 0; }
.un-footer-brand { color: #e6f0f7; font-weight: 700; letter-spacing: .3px; white-space: nowrap; }
.un-footer-text { color: #7f9cb2; white-space: nowrap; }
.un-footer-copy { color: #6d8aa1; white-space: nowrap; }
.un-footer-sep { width: 1px; height: 11px; background: rgba(255, 255, 255, .14); }

/* ────────────── 通用组件 ────────────── */
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip {
  font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px;
  background: var(--slate-soft); color: var(--secondary); border: none; white-space: nowrap;
}
.chip.ok { background: var(--green-soft); color: var(--green); }
.chip.warn { background: var(--amber-soft); color: var(--amber); }
.chip.bad { background: var(--red-soft); color: var(--red); }
.chip.ghost { cursor: pointer; background: var(--slate-soft); color: var(--muted); }
.chip.ghost:hover { background: var(--accent-soft); color: var(--accent); }
button.chip, .chip[data-goto] { cursor: pointer; font-family: inherit; }

.muted { color: var(--muted); font-size: 12.5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card {
  background: var(--panel); border: none; border-radius: var(--radius-lg);
  box-shadow: var(--shadow); padding: 14px 16px;
}
.card .num { font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -.5px; }
.card .label { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.card.alert { background: var(--red-soft); }
.card.clickable { cursor: pointer; transition: transform .12s; }
.card.clickable:active { transform: scale(.97); }
.card.clickable:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, .08); }
.panel {
  background: var(--panel); border: none; border-radius: var(--radius-lg);
  box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden;
}
.panel > h3 {
  margin: 0; padding: 13px 16px; font-size: 14.5px; font-weight: 650;
  border-bottom: 1px solid var(--sep); background: transparent;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.panel .body { padding: 14px 16px; }
.panel .body.tight { padding: 0; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--sep); vertical-align: top; }
th { color: var(--muted); font-weight: 600; background: transparent; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
tr:last-child td { border-bottom: none; }
tbody tr.click { cursor: pointer; transition: background .12s; }
tbody tr.click:hover { background: var(--accent-soft); }
tbody tr.click:active { background: rgba(0, 158, 219, .14); }

.badge {
  display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 9px;
  border-radius: 999px; background: var(--slate-soft); color: var(--secondary); white-space: nowrap;
}
.badge-green { background: var(--green-soft); color: var(--green); }
.badge-red { background: var(--red-soft); color: var(--red); }
.badge-amber { background: var(--amber-soft); color: var(--amber); }
.badge-blue { background: var(--accent-soft); color: var(--accent-deep); }
.badge-purple { background: var(--running-soft); color: var(--running); }
.badge-teal { background: var(--teal-soft); color: var(--teal); }

.btn {
  border: none; background: var(--slate-soft); color: var(--accent-deep);
  padding: 8px 16px; border-radius: 9px; cursor: pointer; font-size: 13.5px;
  font-weight: 600; font-family: inherit; white-space: nowrap;
  transition: opacity .12s, transform .1s, background .12s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--accent-soft); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { background: var(--red); color: #fff; }
.btn.success { background: var(--green); color: #fff; }
.btn.sm { padding: 5px 12px; font-size: 12.5px; border-radius: 8px; }
.btn.lg { padding: 10px 22px; font-size: 15px; border-radius: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ico { position: relative; padding: 7px 10px; line-height: 1.1; background: var(--slate-soft); color: var(--secondary); }
.btn.ico:hover { background: var(--accent-soft); color: var(--accent-deep); }
.un-btn-ghost { background: var(--slate-soft); color: var(--secondary); }
.un-btn-ghost:hover { background: var(--accent-soft); color: var(--accent-deep); }

.empty { color: var(--muted); text-align: center; padding: 28px 10px; font-size: 13.5px; }
.err-box {
  background: var(--red-soft); border: none; color: var(--red);
  border-radius: var(--radius); padding: 11px 14px; margin-bottom: 14px; font-size: 13.5px;
}
.toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.toolbar h2 { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: -.5px; }

input[type=text], select, textarea {
  border: 1px solid var(--sep); border-radius: 9px; padding: 8px 11px;
  font: inherit; font-size: 14px; background: var(--panel); color: var(--text);
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0, 158, 219, .16);
}
textarea { width: 100%; min-height: 90px; resize: vertical; font-family: var(--mono); font-size: 13px; }

/* ────────────── 管道节点 ────────────── */
.pipeline { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 8px 2px 12px; }
.pipeline.compact { padding: 2px; }
.pnode {
  flex: none; min-width: 118px; max-width: 180px;
  border: 1.5px solid var(--sep); background: var(--panel); border-radius: 12px;
  padding: 7px 10px; cursor: pointer; position: relative;
  transition: border-color .15s, box-shadow .15s;
}
.pnode:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.pnode.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 158, 219, .16); }
.pnode .pn-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pnode .pn-meta { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); margin-top: 3px; }
.pnode .pn-idx {
  position: absolute; top: -8px; left: -6px; width: 17px; height: 17px; border-radius: 50%;
  background: var(--slate-soft); color: var(--muted); font-size: 10px;
  display: grid; place-items: center; border: 1px solid var(--sep);
}
.pnode.t-llm { background: var(--accent-soft); }
.pnode.t-gate { background: var(--amber-soft); }
.pnode.t-notify { background: var(--teal-soft); }
.pnode.s-done { border-color: var(--green); }
.pnode.s-failed { border-color: var(--red); background: var(--red-soft); }
.pnode.s-rejected { border-color: var(--red); background: var(--red-soft); }
.pnode.s-waiting_gate { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(178, 107, 0, .16); }
.pnode.s-running, .pnode.s-pending_next { border-color: var(--running); }
.pnode.s-running::after {
  content: ""; position: absolute; inset: -1.5px; border-radius: 12px; pointer-events: none;
  border: 2px solid transparent;
  background: linear-gradient(120deg, var(--running), var(--accent), var(--running)) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: breathe 1.2s ease-in-out infinite;
}
@keyframes breathe { 50% { opacity: .35; } }
.pnode.skipped { opacity: .5; }
.parrow { flex: none; display: grid; place-items: center; width: 26px; color: var(--muted); font-size: 13px; }
.pipeline-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 2px; }
.pipeline-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 4px; vertical-align: -1px; }

/* ────────────── 业务（工作流卡片） ────────────── */
.wf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.wf-card {
  background: var(--panel); border: 1px solid var(--sep); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); padding: 15px 16px; display: flex; flex-direction: column; gap: 10px;
  transition: box-shadow .18s, transform .12s;
}
.wf-card:hover { box-shadow: 0 6px 22px rgba(11, 42, 74, .1); }
.wf-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.wf-id { font-weight: 700; letter-spacing: -.2px; }
.wf-block { font-size: 11px; background: var(--slate-soft); color: var(--muted); border-radius: 999px; padding: 2px 9px; }
.wf-name { color: var(--text); font-size: 13.5px; }
.wf-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.wf-lastrun {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-size: 12.5px; padding: 7px 11px; background: var(--slate-soft);
  border: none; border-radius: 10px;
}
.wf-actions { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }

/* ────────────── 运行详情 ────────────── */
.crumbs { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--accent); }
.run-hero { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.run-hero h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
.run-stat { font-size: 12px; color: var(--muted); }
.run-stat b { color: var(--text); font-size: 13.5px; display: block; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 7px 14px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-all; }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li {
  border: none; border-radius: 10px; margin-bottom: 8px;
  padding: 10px 14px; background: var(--slate-soft);
}
.timeline li.failed { background: var(--red-soft); }
.timeline li.waiting_gate { background: var(--amber-soft); }
.tl-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tl-name { font-weight: 600; }
.tl-idx { color: var(--muted); font-size: 12px; width: 22px; }

details.output { margin-top: 8px; }
details.output summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
details.output pre, pre.raw {
  background: #0f172a; color: #d7e3f4; padding: 10px 12px; border-radius: 10px;
  font-size: 12px; overflow: auto; max-height: 340px; white-space: pre-wrap; word-break: break-word;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme]) details.output pre, :root:not([data-theme]) pre.raw { background: #0a0f16; color: #c9d4e6; } }
:root[data-theme="dark"] details.output pre, :root[data-theme="dark"] pre.raw { background: #0a0f16; color: #c9d4e6; }
.error-text { color: var(--red); font-size: 12.5px; word-break: break-word; }

/* ────────────── 产出物卡片 ────────────── */
.artifacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.artifact {
  border: 1px solid var(--sep); border-radius: var(--radius); background: var(--panel);
  padding: 12px 14px; cursor: pointer; transition: box-shadow .15s, transform .1s;
}
.artifact:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, .08); }
.artifact:active { transform: scale(.98); }
.artifact .af-step { font-size: 11.5px; color: var(--accent); font-weight: 600; }
.artifact .af-title { font-weight: 600; margin: 2px 0 6px; }
.artifact .af-snippet {
  font-size: 12.5px; color: var(--muted); max-height: 60px; overflow: hidden;
  -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent);
}

/* ────────────── 抽屉 ────────────── */
#drawer-root:not(:empty) { position: fixed; inset: 0; z-index: 40; }
#drawer-root .drawer-mask { position: absolute; inset: 0; background: rgba(0, 0, 0, .38); }
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 92vw);
  background: var(--panel); box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
  animation: slidein .22s cubic-bezier(.32, .72, 0, 1);
}
@keyframes slidein { from { transform: translateX(40px); opacity: .5; } }
.drawer header {
  padding: 14px 18px; border-bottom: 1px solid var(--sep);
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.drawer header .t { font-weight: 650; font-size: 15px; }
.drawer .content { padding: 16px 18px; overflow: auto; flex: 1; }
.drawer footer { padding: 12px 18px; border-top: 1px solid var(--sep); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--sep); margin-bottom: 12px; }
.tabs button {
  border: none; background: none; padding: 8px 14px; cursor: pointer; font: inherit;
  color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500;
}
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* ────────────── 审计 ────────────── */
.event-tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--slate-soft); color: var(--muted); }
.event-tag.bad { background: var(--red-soft); color: var(--red); }
.event-tag.warn { background: var(--amber-soft); color: var(--amber); }
.event-tag.ok { background: var(--green-soft); color: var(--green); }

/* ────────────── Markdown ────────────── */
.md { font-size: 14px; line-height: 1.7; word-break: break-word; }
.md h1 { font-size: 21px; margin: 14px 0 8px; border-bottom: 1px solid var(--sep); padding-bottom: 6px; }
.md h2 { font-size: 17.5px; margin: 14px 0 8px; }
.md h3 { font-size: 15.5px; margin: 12px 0 6px; }
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 8px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md blockquote { border-left: 3px solid var(--accent); margin: 8px 0; padding: 2px 12px; color: var(--muted); background: var(--slate-soft); }
.md code { background: var(--slate-soft); border-radius: 5px; padding: 1px 5px; font-size: 12.5px; }
.md pre { background: #0f172a; color: #d7e3f4; padding: 10px 12px; border-radius: 10px; overflow: auto; }
.md pre code { background: none; color: inherit; padding: 0; }
.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.md th, .md td { border: 1px solid var(--sep); padding: 6px 10px; }
.md th { background: var(--slate-soft); }
.md hr { border: none; border-top: 1px solid var(--sep); margin: 14px 0; }
.md a { text-decoration: underline; }

/* ────────────── 模态框 ────────────── */
#modal-root:not(:empty) {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .42);
  display: grid; place-items: center; z-index: 60; padding: 20px;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.modal {
  background: var(--panel); border-radius: 18px; width: min(600px, 100%);
  box-shadow: var(--shadow-lg); overflow: hidden; max-height: 88vh;
  display: flex; flex-direction: column;
  animation: pop .2s cubic-bezier(.32, .72, 0, 1);
}
@keyframes pop { from { transform: scale(.94); opacity: .5; } }
.modal header {
  padding: 15px 18px; border-bottom: 1px solid var(--sep); font-weight: 700;
  font-size: 15.5px; display: flex; justify-content: space-between; align-items: center;
}
.modal .content { padding: 16px 18px; overflow: auto; }
.modal footer { padding: 12px 18px; border-top: 1px solid var(--sep); display: flex; justify-content: flex-end; gap: 10px; }
.modal label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
.modal .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.modal .close { border: none; background: var(--slate-soft); font-size: 16px; cursor: pointer; color: var(--muted); width: 28px; height: 28px; border-radius: 50%; line-height: 1; }
.modal .close:hover { color: var(--text); }
.radio-row { display: flex; gap: 16px; font-size: 13.5px; align-items: center; flex-wrap: wrap; }
.radio-row label { display: flex; gap: 6px; align-items: center; margin: 0; color: var(--text); cursor: pointer; }

/* ────────────── Toast ────────────── */
#toast-root { position: fixed; right: 18px; bottom: calc(48px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; z-index: 99; }
.toast {
  background: #1c2b3a; color: #fff; padding: 11px 16px; border-radius: 12px;
  font-size: 13.5px; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(8px);
  transition: all .25s; max-width: 380px; word-break: break-all;
}
.toast.show { opacity: 1; transform: none; }
.toast.ok { background: #0b3d1e; }
.toast.err { background: #4a1010; }

/* ────────────── 骨架屏 ────────────── */
.skeleton {
  background: linear-gradient(90deg, rgba(120, 120, 128, .1) 25%, rgba(120, 120, 128, .18) 50%, rgba(120, 120, 128, .1) 75%);
  background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 10px;
}
@keyframes sk { to { background-position: -200% 0; } }
.sk-line { height: 16px; margin-bottom: 10px; }
.sk-card { height: 96px; margin-bottom: 14px; }
.sk-wrap .sk-line:last-child { margin-bottom: 0; }

.hidden { display: none !important; }
.spinning {
  display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(191, 90, 242, .25);
  border-top-color: var(--running); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ────────────── 指挥台（自然语言对话） ────────────── */
.chat-page {
  display: flex; flex-direction: column;
  height: calc(100% - 76px); min-height: 460px;
  max-width: 860px; margin: 0 auto; width: 100%;
  background: var(--panel); border: 1px solid var(--sep);
  border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden;
}
.chat-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: 14px 20px 10px; border-bottom: 1px solid var(--sep); background: transparent;
}
.chat-title { font-size: 17px; font-weight: 700; letter-spacing: -.3px; color: var(--text); }
.chat-title::after { display: none; }
.chat-head .chips button { cursor: pointer; }
.chat-head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.chat-head-right .chips { justify-content: flex-end; }
.linkbtn {
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--accent); font-size: 12.5px; font-family: inherit; text-decoration: underline;
}
.linkbtn:hover { opacity: .75; }

.entry-groups {
  display: flex; flex-direction: column; gap: 4px;
  padding: 8px 20px 8px; border-bottom: 1px solid var(--sep); background: var(--bg);
}
.eg-row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.eg-label { font-size: 11px; font-weight: 600; color: var(--muted); background: transparent; border-radius: 999px; padding: 2px 6px; flex: none; }
.eg-chip {
  font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
  border: none; background: var(--panel); color: var(--secondary);
  font-family: inherit; transition: background .12s, color .12s; box-shadow: var(--shadow);
}
.eg-chip:hover { background: var(--accent-soft); color: var(--accent); }
.eg-chip.report { background: var(--amber-soft); color: var(--amber); }
.eg-chip.report:hover { background: var(--amber); color: #fff; }
.eg-toggle { align-self: flex-start; font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; }
.entry-groups:not(.eg-open) .eg-row:nth-of-type(2) { display: none; }
.entry-groups:not(.eg-open) .eg-row:nth-of-type(1) .eg-chip:nth-of-type(n+4) { display: none; }

.brief-card:not([hidden]) {
  margin: 12px 14px 0; padding: 12px 14px; font-size: 13.5px;
  background: var(--accent-soft); border: none;
  border-left: 3px solid var(--accent); border-radius: var(--radius);
}
.brief-card .brief-title { font-weight: 700; margin-bottom: 6px; }
.brief-card ul { margin: 4px 0 0; padding-left: 18px; }
.brief-card li { margin: 3px 0; }
.pulse-bar:not([hidden]) {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 12px 14px 0; padding: 9px 12px; font-size: 12.5px;
  background: var(--amber-soft); border: none;
  border-left: 3px solid var(--amber); border-radius: var(--radius);
}
.pulse-bar .pb-label { font-weight: 700; }
.pulse-bar .pb-item { background: var(--panel); border: none; border-radius: 999px; padding: 2px 9px; box-shadow: var(--shadow); }
.pulse-bar .pb-item.pb-critical { color: var(--red); }
.urgent-pin:not([hidden]) {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 12px 14px 0; padding: 9px 12px; font-size: 13.5px;
  background: var(--red-soft); border: none;
  border-left: 3px solid var(--red); border-radius: var(--radius);
}
.urgent-pin.up-warn { background: var(--amber-soft); border-left-color: var(--amber); }
.urgent-pin .muted { font-size: 11.5px; }
.pur-add { display: flex; gap: 8px; margin-bottom: 10px; }
.pur-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--sep); font-size: 13.5px; }
.pur-ops { display: flex; gap: 6px; flex-shrink: 0; }
.pur-row .chip { font-size: 11px; padding: 2px 8px; vertical-align: 1px; }
.pur-meta { display: flex; gap: 6px; align-items: center; margin: 5px 0; flex-wrap: wrap; }
.pur-meta .pm-goal { flex: 1; min-width: 150px; }
.pur-meta .pm-owner { width: 92px; }
.ms-list { margin: 6px 0 4px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.ms-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; }
.ms-list .linkbtn { padding: 0 4px; }
.ms-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.ms-done { text-decoration: line-through; color: var(--muted); }
.dec-form { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.dec-opts { display: flex; gap: 6px; }
.dec-opts input { flex: 1; min-width: 0; }
#brief-card .linkbtn { font-size: 12px; padding: 1px 4px; }
.focus-edit { display: flex; gap: 8px; margin-bottom: 8px; }
.focus-edit input { flex: 1; }
.focus-sec { margin-top: 8px; font-size: 13.5px; }
.focus-sec ul { margin: 4px 0 0; padding-left: 18px; }
.focus-sec li { margin: 3px 0; }
.focus-sec .muted { margin-left: 6px; font-size: 11.5px; }
.chat-stream { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.chat-suggest { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 16px 0; }
.sug {
  font-size: 12.5px; padding: 5px 13px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--sep); background: var(--panel); color: var(--accent-deep);
  font-family: inherit; font-weight: 500; transition: background .12s, color .12s, border-color .12s;
}
.sug:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.attach-chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 14px 0; align-items: center; }
.attach-chips:empty { display: none; }
.attach-chip {
  font-size: 12.5px; background: var(--slate-soft); border: none;
  border-radius: 999px; padding: 4px 11px; display: inline-flex; gap: 6px; align-items: center;
}
.attach-chip.warn { background: var(--amber-soft); color: var(--amber); }
.attach-chip button { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 14px; padding: 0; }
.attach-chip button:hover { color: var(--red); }
.chat-input {
  display: flex; gap: 10px; align-items: flex-end;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom) * 0);
  border-top: 1px solid var(--sep); background: transparent;
}
.chat-input textarea {
  flex: 1; min-height: 40px; max-height: 140px; min-width: 0;
  font-family: inherit; font-size: 14.5px; resize: none; line-height: 1.45;
  padding: 9px 16px; border-radius: 20px; background: var(--bg);
  border: 1.5px solid var(--sep);
  transition: border-color .15s, box-shadow .15s;
}
.chat-input textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0, 158, 219, .16);
  outline: none;
}
.chat-input .btn { height: 40px; border-radius: 20px; }

.msg { display: flex; gap: 10px; max-width: 88%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg .avatar {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  background: linear-gradient(135deg, #00a9e0, #0a5a82); color: #fff;
  display: grid; place-items: center; font-size: 13px;
}
.msg .bubble { background: var(--slate-soft); border: none; border-radius: 18px; padding: 10px 14px; min-width: 0; box-shadow: none; }
.msg.user .bubble { background: var(--accent); color: #fff; }
.msg.user .bubble-text { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
.msg.user .msg-time { color: rgba(255, 255, 255, .72); }
.bubble-files { font-size: 12.5px; color: rgba(255, 255, 255, .88); margin-top: 6px; }
.msg-time { font-size: 11px; color: var(--muted); margin-top: 6px; }
.msg.sys { max-width: 100%; align-self: center; }
.sys-pill {
  font-size: 12.5px; padding: 7px 14px; border-radius: 999px;
  background: var(--green-soft); color: var(--green); border: none;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.sys-pill.warn { background: var(--amber-soft); color: var(--amber); }
.sys-pill.bad { background: var(--red-soft); color: var(--red); }
.sys-pill a { color: inherit; text-decoration: underline; }
.parsed-hint { font-size: 11.5px; color: var(--amber); margin-top: 4px; }

.miss-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.miss-chips .miss { border: 1px dashed var(--accent); background: var(--accent-soft); }
.miss-hint { font-size: 11.5px; width: 100%; }

.typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: ty 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes ty { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }

.act-card { margin-top: 10px; border: 1px solid var(--sep); border-radius: 14px; background: var(--panel); overflow: hidden; min-width: 240px; }
.act-card.ok { background: var(--green-soft); }
.act-head {
  font-size: 12.5px; font-weight: 600; color: var(--accent-deep); padding: 8px 12px;
  border-bottom: 1px solid var(--sep); background: var(--accent-soft);
  display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
}
.act-card.ok .act-head { background: var(--green-soft); color: var(--green); border-color: transparent; }
.act-body { padding: 10px 12px; font-size: 13.5px; }
.act-body .muted { margin-top: 4px; }
.act-result { margin-top: 8px; border-top: 1px dashed var(--sep); padding-top: 8px; max-height: 300px; overflow: auto; }
.act-foot { display: flex; gap: 8px; padding: 0 12px 11px; flex-wrap: wrap; }

/* ────────────── 定时中心 ────────────── */
.ai-sch-row { display: flex; gap: 10px; align-items: flex-start; }
.ai-sch-row textarea { min-height: 56px; font-family: inherit; font-size: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 14px; }
.form-grid label { display: block; font-size: 12.5px; color: var(--muted); }
.form-grid input, .form-grid select { display: block; width: 100%; margin-top: 3px; font-size: 13.5px; padding: 7px 10px; }
.form-grid input[readonly] { background: var(--slate-soft); color: var(--muted); }

/* ────────────── 情报聚合条 ────────────── */
.intel-bar {
  display: flex; gap: 6px; align-items: center; padding: 6px 20px;
  overflow-x: auto; flex-wrap: nowrap; white-space: nowrap;
  border-bottom: 1px solid var(--sep); background: var(--bg);
  scrollbar-width: none;
}
.intel-bar::-webkit-scrollbar { display: none; }
.ib-label { font-size: 11px; color: var(--muted); background: transparent; border: none; border-radius: 999px; padding: 2px 6px; flex: none; }
.ib-chip, .ib-all {
  font-size: 11.5px; border: none; background: var(--panel); border-radius: 999px;
  padding: 3px 10px; cursor: pointer; max-width: 200px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; color: var(--secondary); font-family: inherit; flex: none;
}
.ib-chip:hover, .ib-all:hover { background: var(--accent-soft); color: var(--accent); }
.ib-row { border-bottom: 1px dashed var(--sep); padding: 9px 2px; }
.ib-row:last-child { border-bottom: none; }
.ib-row-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
.ib-src { font-size: 11px; background: var(--slate-soft); color: var(--muted); border-radius: 5px; padding: 1px 7px; }
.intel-low { margin-top: 8px; border-top: 1px dashed var(--sep); padding-top: 6px; }
.intel-low > summary { cursor: pointer; font-size: 12.5px; padding: 4px 2px; }
.intel-low[open] > summary { margin-bottom: 4px; }

/* ────────────── 执行确认卡步骤链 ────────────── */
.plan-steps { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 6px 0 2px; }
.pstep { font-size: 11px; background: var(--slate-soft); border: none; border-radius: 5px; padding: 2px 7px; color: var(--secondary); }
.pstep.gate { background: var(--amber-soft); color: var(--amber); }
.psep { font-size: 10px; color: var(--muted); }

/* ────────────── 质量评审徽标 ────────────── */
.qscore { font-size: 11px; border-radius: 999px; padding: 1px 9px; margin-left: 6px; font-weight: 600; border: none; display: inline-block; }
.qscore.ok { background: var(--green-soft); color: var(--green); }
.qscore.warn { background: var(--amber-soft); color: var(--amber); }

/* ────────────── R7 数据源 / 连接器 / 告警 ────────────── */
.conn-banner { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; font-size: 12.5px; padding: 8px 12px; border-radius: 10px; background: var(--amber-soft); color: var(--text); border: 1px solid var(--amber); margin-bottom: 12px; }
.src-badge { font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 2px 8px; white-space: nowrap; align-self: center; }
.src-badge.mock { background: var(--amber-soft); color: var(--amber); }
.src-badge.gen { background: var(--teal-soft); color: var(--teal); }
.digest-alerts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.digest-alert { font-size: 13px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--amber); background: var(--amber-soft); color: var(--text); }
.digest-alert.high { border-color: var(--red); background: var(--red-soft); }

/* ────────────── Agent 步骤条 + 三级置信 ────────────── */
.agent-box { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--sep); }
.agent-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; font-weight: 600; color: var(--secondary); }
.conf-badge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 9px; }
.conf-badge.hi { background: var(--green-soft); color: var(--green); }
.conf-badge.mid { background: var(--accent-soft); color: var(--accent-deep); }
.conf-badge.low { background: var(--amber-soft); color: var(--amber); }
.agent-steps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.astep { font-size: 11.5px; background: var(--panel); color: var(--secondary); border-radius: 7px; padding: 3px 8px; border: 1px solid var(--sep); }
.astep i { font-style: normal; color: var(--muted); }
.astep u { text-decoration: none; color: var(--red); }
.astep.bad { border-color: var(--red); }
.agent-srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }

.chart-svg .tick { font-size: 8px; fill: var(--muted); }
.chart-note { font-size: 11.5px; margin-top: 5px; }

/* ────────────── 设置中枢 ────────────── */
.set-page .toolbar { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }

.set-card {

.overview-card {

.more-box { margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: var(--slate-soft); font-size: 13px; }

/* ────────────── 情报 Tab 未读红点 / 报告卡片流 ────────────── */

.rpt-card { padding: 12px 16px; border-bottom: 1px solid var(--sep); cursor: pointer; transition: background .12s; position: relative; }

.rc-meta { margin-top: 4px; padding-left: 14px; }
.rpt-card .rc-dot { position: absolute; left: 6px; top: 17px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* ────────────── 全局搜索 ────────────── */
.search-row { display: flex; gap: 8px; }

/* ────────────── 我的·运行状况 / 加载更多 ────────────── */
.ops-sec { margin-bottom: 14px; }

#rpt-more-wrap .btn, #kb-more-wrap .btn, #task-table .btn { font-size: 13px; }

/* ────────────── 表格 → 卡片（≤680px） ────────────── */
@media (max-width: 680px) {

.drawer footer { display: flex; flex-wrap: wrap; gap: 8px; }

.skip-link { position: fixed; left: -9999px; top: 0; z-index: 300; padding: 9px 16px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; border-radius: 0 0 10px 0; text-decoration: none; }

.modal:focus-within, .drawer:focus-within { box-shadow: 0 0 0 1px var(--accent-soft), var(--shadow-lg); }

/* ────────────── 报告内嵌服务端 SVG 图表 ────────────── */
.rpt-charts { display: grid; gap: 10px; margin: 0 0 14px; }
.rpt-chart { background: var(--panel); border: 1px solid var(--sep); border-radius: 10px; padding: 10px 10px 8px; box-shadow: var(--shadow); }

/* ═══════════════ 响应式 ═══════════════ */

   + '<div class="artifact"><div class="af-step">产出物 · 撰写专报草稿</div><div class="af-title">宏观与产业研究专报.md</div><div class="af-snippet">本周新能源装机同比+12%，现代农业供应链数字化加速……</div></div>'

   + '</div></div></div>';
}
function vAudit(){
  return '<div class="toolbar"><h2>📜 审计</h2><span class="muted">事件流水 · 一键导出 CSV</span></div>'
   + '<div class="chips" style="margin-bottom:12px"><span class="chip">全部</span><span class="chip ok">成功</span><span class="chip bad">失败</span></div>'
   + '<div class="panel"><div class="body tight"><table class="tbl-cards"><thead><tr><th>时间</th><th>事件</th><th>内容</th></tr></thead><tbody>'
   + EVENTS.map(function(e){ return '<tr><td data-label="时间" class="muted mono">'+e.ts+'</td><td data-label="事件"><span class="event-tag '+e.ev+'">'+e.t+'</span></td><td data-label="内容">'+esc(e.d)+'</td></tr>'; }).join('')
   + '</tbody></table></div></div>';
}
function vSettings(){
  return '<div class="set-page"><div class="toolbar"><h2>🛠 设置</h2><span class="muted">运维中枢 · 运行 · 洞察 · 数据源 · 推送 · 系统</span></div>'
   + '<div class="set-grid">'
   + '<div class="set-card"><div class="set-ico">🗂</div><b>业务工作流</b><span class="muted">13 条 · 画布</span></div>'
   + '<div class="set-card"><div class="set-ico">✅</div><b>成果与任务</b><span class="muted">运行记录</span></div>'
   + '<div class="set-card"><div class="set-ico">🧾</div><b>审计日志</b><span class="muted">全量事件</span></div>'
   + '<div class="set-card"><div class="set-ico">🎨</div><b>外观</b><span class="muted">浅色/深色/跟随系统</span></div>'
   + '</div>'
   + '<div class="panel"><h3>🩺 运行状况</h3><div class="body"><div class="ops-sec"><b>今日成效</b>'
   + '<div class="cards" style="margin-bottom:0"><div class="card"><div class="num">2</div><div class="label">完成</div></div><div class="card"><div class="num">0</div><div class="label">失败</div></div><div class="card"><div class="num">5</div><div class="label">告警</div></div></div></div>'
   + '<div class="ops-sec"><b>错过的定时</b><div class="digest-alert">⏰ 昨日 07:00 「涉外舆情与品牌监测」应触发未触发，请手动补跑</div></div></div></div>'
   + '<div class="panel"><h3>📈 系统洞察</h3><div class="body"><div class="chart-grid">'
   + ['💰 Token 成本','✅ 任务量','🌊 情报新增','📚 知识库增长'].map(function(t){ return '<div class="chart-cell"><div class="chart-t">'+t+'</div><div style="height:80px;background:var(--slate-soft);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:12px">趋势图</div><div class="muted chart-note">近 14 天 · 本地 SVG 渲染</div></div>'; }).join('')
   + '</div></div></div>'
   + '<div class="panel"><h3>🌊 数据源抓取</h3><div class="body"><div class="chips" style="margin-bottom:10px"><span class="chip ok">自动更新已开启（7 个来源）</span></div>'
   + '<table class="tbl-cards"><thead><tr><th>来源</th><th>状态</th><th>新增</th></tr></thead><tbody>'
   + [['中国新闻网 · 三农','成功','+6'],['中国政府网','成功','+2'],['中国农业网','成功','+4']].map(function(r){ return '<tr><td data-label="来源">'+r[0]+'</td><td data-label="状态"><span class="badge badge-green">'+r[1]+'</span></td><td data-label="新增">'+r[2]+'</td></tr>'; }).join('')
   + '</tbody></table><button class="btn sm" style="margin-top:10px">🔄 全量手动采集</button></div></div>'
   + '<div class="panel"><h3>❤️ 系统状态</h3><div class="body"><div class="chips"><span class="chip ok">服务 正常</span><span class="chip ok">LLM 已配置</span><span class="chip ok">调度器 运行中</span><span class="chip ok">MCP 已挂载</span></div></div></div>'
   + '</div>';
}
var VIEWS = { assistant:vAssistant, reports:vReports, kb:vKb, schedules:vSchedules, workflows:vWorkflows, tasks:vTasks, audit:vAudit, settings:vSettings };
function render(){
  var r = currentRoute();
  $$('#nav a').forEach(function(a){ a.classList.toggle('active', a.dataset.view === r.view); });
  var v = $('#view');
  v.innerHTML = (VIEWS[r.view]||VIEWS.assistant)();
  // 示例导航按钮 → 切到对应页
  $$('.set-card[data-go]').forEach(function(c){ c.onclick = function(){ location.hash = c.getAttribute('data-go'); }; });
}
document.addEventListener('DOMContentLoaded', function(){
  var fy = $('#footer-year'); if (fy) fy.textContent = String(new Date().getFullYear());
  $('#btn-refresh').addEventListener('click', render);
  $('#btn-search').addEventListener('click', function(){ toast('全局搜索（预览）'); });
  $('#btn-notif').addEventListener('click', function(){ toast('通知中心（预览）'); });
  $('#btn-help').addEventListener('click', function(){ toast('帮助（预览）'); });
  $('#btn-user').addEventListener('click', function(){ toast('当前身份（预览）'); });
  if (!location.hash) location.hash = '#/assistant';
  render();
  window.addEventListener('hashchange', render);
});
function toast(msg){ var t = document.createElement('div'); t.className = 'toast show'; t.textContent = msg; var root = $('#toast-root'); if(!root) return; root.appendChild(t); setTimeout(function(){ t.remove(); }, 1800); }

</script>
</body>
</html>
